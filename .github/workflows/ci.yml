name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: "Lint: ruff"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      # Blocking. Rule set is configured in pyproject.toml [tool.ruff.lint];
      # it is deliberately narrow (E9 + F) so that it stays at zero and stays
      # enforced. Widen it there, one family per PR — not here.
      - name: Ruff check (blocking)
        run: ruff check pamola_core/ --no-fix

      # Informational: shows what the wider rule families would flag, so the
      # ratchet in pyproject.toml can be raised with real numbers.
      - name: Ruff check (wider set, informational)
        run: ruff check pamola_core/ --select E,W,B,S,UP,SIM,DTZ --statistics || true

  test:
    name: "Test: pytest"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ --tb=short -q \
            --junitxml=reports/junit.xml \
            --cov --cov-report=html:reports/coverage-html \
            --cov-report=term

      # Non-blocking for now: the codebase is typed but has never been type
      # checked, so the first run's finding count is unknown. Promote to
      # blocking once a baseline exists and has been driven to zero.
      - name: Type check (mypy, informational)
        run: |
          pip install mypy
          mypy pamola_core/ --ignore-missing-imports --no-error-summary || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          retention-days: 30

  build:
    name: "Build: sdist + wheel"
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify version consistency
        run: |
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          WHL=$(ls dist/*.whl)
          echo "pyproject.toml version: $PKG_VERSION"
          echo "Built wheel: $WHL"
          echo "$WHL" | grep -q "$PKG_VERSION" || (echo "ERROR: wheel version mismatch" && exit 1)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
