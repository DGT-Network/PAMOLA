name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: "Lint: ruff"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      # Blocking. Rule set is configured in pyproject.toml [tool.ruff.lint];
      # it is deliberately narrow (E9 + F) so that it stays at zero and stays
      # enforced. Widen it there, one family per PR — not here.
      # tests/ is linted too, deliberately. Linting only the package hid nine
      # F811 redefinitions inside tests/ — and a redefined test function does
      # not fail, it silently never runs. In at least one case the shadowed
      # half was the more valuable of the pair (the public-API path), so the
      # suite was reporting a pass for a test that never executed.
      - name: Ruff check (blocking)
        run: ruff check pamola_core/ tests/ --no-fix

      # Informational: shows what the wider rule families would flag, so the
      # ratchet in pyproject.toml can be raised with real numbers.
      - name: Ruff check (wider set, informational)
        run: ruff check pamola_core/ --select E,W,B,S,UP,SIM,DTZ --statistics || true

  test:
    name: "Test: pytest"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # `viz` as well as `test`: the suite exercises the plotting paths,
          # and two test modules import matplotlib directly. Since FP-02a the
          # plotting stack is optional, so `[test]` alone cannot collect them.
          pip install -e ".[test,viz]"

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ --tb=short -q \
            --junitxml=reports/junit.xml \
            --cov --cov-report=html:reports/coverage-html \
            --cov-report=term

      # Non-blocking for now: the codebase is typed but has never been type
      # checked, so the first run's finding count is unknown. Promote to
      # blocking once a baseline exists and has been driven to zero.
      - name: Type check (mypy, informational)
        run: |
          pip install mypy
          mypy pamola_core/ --ignore-missing-imports --no-error-summary || true

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: reports/
          retention-days: 30

  wheel:
    name: "Wheel: build, twine check, clean-venv smoke"
    # Independent of lint/test so the shipped artifact is exercised on every PR,
    # not only after merge. Same script as release.yml (scripts/wheel_smoke.sh).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify version consistency
        run: |
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "pyproject.toml version: $PKG_VERSION"
          ls -l dist/
          compgen -G "dist/pamola_core-${PKG_VERSION}-*.whl" >/dev/null || (echo "ERROR: wheel version mismatch" && exit 1)
          echo "PKG_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"

      - name: twine check
        run: twine check --strict dist/*

      - name: Install the exact wheel in a clean venv and smoke it
        run: |
          mkdir wheel-under-test
          cp dist/*.whl wheel-under-test/
          bash scripts/wheel_smoke.sh wheel-under-test "$PKG_VERSION"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  supply-chain:
    name: "Supply chain: pip-audit on the installed wheel, license report"
    # The audited environment is the one the wheel installs into (its pinned dependency tree),
    # not the CI tooling. Known vulnerabilities fail the job; the licenses are an artifact.
    needs: wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download the built distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install the wheel into a clean environment
        run: |
          python -m venv "$RUNNER_TEMP/app"
          "$RUNNER_TEMP/app/bin/python" -m pip install --quiet --upgrade pip
          "$RUNNER_TEMP/app/bin/python" -m pip install --quiet dist/*.whl

      - name: Install the audit tools in a separate environment
        run: |
          python -m venv "$RUNNER_TEMP/tools"
          "$RUNNER_TEMP/tools/bin/python" -m pip install --quiet pip-audit pip-licenses

      - name: pip-audit (known vulnerabilities fail the job)
        run: |
          SITE=$("$RUNNER_TEMP/app/bin/python" -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
          "$RUNNER_TEMP/tools/bin/pip-audit" --path "$SITE" --progress-spinner off

      - name: Dependency license report
        run: |
          mkdir -p reports
          "$RUNNER_TEMP/tools/bin/pip-licenses" --python "$RUNNER_TEMP/app/bin/python" --format=json --with-urls --output-file reports/dependency-licenses.json
          "$RUNNER_TEMP/tools/bin/pip-licenses" --python "$RUNNER_TEMP/app/bin/python" --format=markdown --output-file reports/dependency-licenses.md

      - name: Upload the license report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-licenses
          path: reports/
          retention-days: 30
