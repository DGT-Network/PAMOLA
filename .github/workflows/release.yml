name: Release

# One build, many checks, one upload of the SAME files.
#
#   tag v*  -> validate -> build (wheel + sdist, once, twine check)
#                          -> smoke   (exact wheel, clean venv, 3 OSes, 3.10-3.12)
#                          -> test    (pytest, source install)
#                          -> publish-testpypi  (pre-release tags, manual runs)
#                          -> publish-pypi      (stable tags only)
#
# Publishing uses PyPI Trusted Publishing (OIDC): there is no PYPI_API_TOKEN and
# `id-token: write` is granted to the two publish jobs only. Both consume the
# artifact built in `build`; nothing is rebuilt after it was tested.
#
# Maintainer settings this relies on (see RELEASING.md):
#   - GitHub environments `testpypi` and `pypi` (`pypi`: required reviewers, tags v*)
#   - Trusted publisher entries on pypi.org and test.pypi.org pointing at this
#     repository, this workflow file (release.yml) and the matching environment.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    # Manual runs build and test the selected ref and publish to TestPyPI only.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: "Validate: release checks"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Determine version and release type
        id: release
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          # PEP 440 parsing (packaging.version), not a regex: `1.0.0rc1.post1` and
          # `1.0.0a1.post2` are pre-releases; local versions (`+...`) are rejected.
          python -m pip install packaging
          python scripts/release_version.py "$REF_TYPE" "$REF_NAME"

      - name: Verify the tag is on the expected branch
        if: github.ref_type == 'tag'
        env:
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then EXPECTED_BRANCH=develop; else EXPECTED_BRANCH=main; fi
          TAG_COMMIT=$(git rev-list -n 1 "refs/tags/$TAG")
          # Fetch exactly the expected branch and require the tagged commit to be
          # an ancestor of it. (A contains+grep check on remote branch names would
          # also accept `origin/main-unreviewed`.)
          git fetch --no-tags origin "+refs/heads/${EXPECTED_BRANCH}:refs/remotes/origin/${EXPECTED_BRANCH}"
          if ! git merge-base --is-ancestor "$TAG_COMMIT" "refs/remotes/origin/${EXPECTED_BRANCH}"; then
            echo "ERROR: tag $TAG must be on $EXPECTED_BRANCH"
            echo "  - pre-releases (a/b/rc/dev) -> develop"
            echo "  - stable releases           -> main"
            exit 1
          fi

      - name: Verify version in CHANGELOG
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          grep -q "$VERSION" CHANGELOG.md || (echo "ERROR: version $VERSION not in CHANGELOG.md" && exit 1)

  build:
    name: "Build: wheel + sdist (once)"
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify the filenames carry the release version
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          ls -l dist/
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          test "${#wheels[@]}" -eq 1 && test "${#sdists[@]}" -eq 1 || (echo "ERROR: expected exactly one wheel and one sdist" && exit 1)
          test -f "dist/pamola_core-${VERSION}.tar.gz" || (echo "ERROR: sdist version mismatch" && exit 1)
          compgen -G "dist/pamola_core-${VERSION}-*.whl" >/dev/null || (echo "ERROR: wheel version mismatch" && exit 1)

      - name: twine check
        run: twine check --strict dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 30

  smoke:
    name: "Smoke: exact wheel (${{ matrix.os }}, py${{ matrix.python-version }})"
    runs-on: ${{ matrix.os }}
    needs: [validate, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python-version: "3.10" }
          - { os: ubuntu-latest, python-version: "3.11" }
          - { os: ubuntu-latest, python-version: "3.12" }
          - { os: windows-latest, python-version: "3.11" }
          - { os: macos-latest, python-version: "3.12" }
    defaults:
      run:
        shell: bash
    steps:
      # The checkout supplies only the smoke scripts; the package under test is
      # the downloaded wheel, installed into a fresh venv outside the checkout.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Download the built distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install the exact wheel in a clean venv and smoke it
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          # the sdist is not part of this check; keep only the wheel in the directory
          mkdir wheel-under-test
          cp dist/*.whl wheel-under-test/
          bash scripts/wheel_smoke.sh wheel-under-test "$VERSION"

  test:
    name: "Test: pytest (py${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,viz]"   # the suite covers plotting paths (FP-02a)

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ --tb=short -q \
            --junitxml=reports/junit-py${{ matrix.python-version }}.xml \
            --cov --cov-report=html:reports/coverage-html-py${{ matrix.python-version }} \
            --cov-report=term

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-test-reports-py${{ matrix.python-version }}
          path: reports/
          retention-days: 30

  publish-testpypi:
    name: "Publish: TestPyPI"
    # Pre-release tags and manual runs. Stable tags skip TestPyPI.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.validate.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    needs: [validate, build, smoke, test]
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pamola-core/
    permissions:
      contents: read
      id-token: write # Trusted Publishing (OIDC); granted to the publish jobs only
    steps:
      - uses: actions/checkout@v4   # only for scripts/check_testpypi_digests.py; nothing is built here

      - name: Download the validated distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Refuse to skip files whose bytes differ from the tested build
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: python3 scripts/check_testpypi_digests.py dist pamola-core "$VERSION"

      - name: Publish to TestPyPI
        # pypa/gh-action-pypi-publish v1.14.3, pinned by commit
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          attestations: true
          skip-existing: true

  publish-pypi:
    name: "Publish: PyPI"
    # Stable tags only; never a manual run, never a pre-release.
    if: >-
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      needs.validate.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    needs: [validate, build, smoke, test]
    environment:
      name: pypi # protected: required reviewers, tags v*
      url: https://pypi.org/project/pamola-core/
    permissions:
      contents: read
      id-token: write # Trusted Publishing (OIDC); granted to the publish jobs only
    steps:
      - name: Download the validated distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Publish to PyPI
        # pypa/gh-action-pypi-publish v1.14.3, pinned by commit
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: dist/
          attestations: true
